name: House Music input gateway tests

on:
  push:
    branches:
      - feature/audio-input-gateway
    paths:
      - 'pi_input/**'
      - 'tests/test_gateway.py'
      - '.github/workflows/input-gateway-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_gateway.py -v
