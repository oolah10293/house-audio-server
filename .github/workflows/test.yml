name: Test house-audio-server

on:
  push:
    branches: [main, 'release/house-music-0.14.2']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m py_compile house_audio_server.py
      - name: Check installer shell syntax
        run: sh -n install.sh install-cd.sh rollback-cd.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax and sorting tests
        run: |
          node --check web/house.js
          node --check web/subwoofers.js
          node tests/test_house_browse.js
      # This explicitly authorized release branch packages only on its own push.
      # PRs and unrelated branches run tests without packaging a release.
      - name: Package installable House Music source
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/house-music-0.14.2'
        run: |
          git archive --format=zip --output=house-audio-server-v0.14.2.zip HEAD
          sha256sum house-audio-server-v0.14.2.zip > house-audio-server-v0.14.2.sha256
          cat house-audio-server-v0.14.2.sha256
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('house-audio-server-v0.14.2.zip') as z:
              files = set(z.namelist())
              required = {'house_audio_server.py', 'subwoofers.py', 'install.sh',
                          'web/house.html', 'web/house.js', 'web/house.css',
                          'web/subwoofers.html', 'web/subwoofers.js',
                          'web/subwoofers.css'}
              assert required <= files, f"Missing release files: {required - files}"
              source = z.read('house_audio_server.py').decode()
              assert 'SERVICE_VERSION = "0.14.2"' in source
              assert '"/": ("house.html"' in source
              assert 'SNAPCAST_MONITOR.volume_fallback = SUBWOOFERS' in source
              install = z.read('install.sh').decode()
              assert 'Refusing installation' in install
              print('Package verification: version, browser routes, fallback and installer verified.')
          PY
      - name: Upload install package
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/house-music-0.14.2'
        uses: actions/upload-artifact@v4
        with:
          name: house-audio-server-v0.14.2
          path: |
            house-audio-server-v0.14.2.zip
            house-audio-server-v0.14.2.sha256
          if-no-files-found: error

      # This explicitly user-authorized CD package is built only for the
      # dedicated draft integration PR after all tests pass. Never package main
      # or the historical 0.14.2 release with these unaccepted additions.
      - name: Assemble user-authorized CD source installer
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/cd-house-playback'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          files = [
              'INSTALL_CD.txt', 'install-cd.sh', 'rollback-cd.sh', 'install.sh',
              'house_audio_server.py', 'input_sources.py',
              'radio_history.py', 'radio_listening.py', 'radio_metadata.py',
              'radio_stations.py', 'state_file.py', 'subwoofers.py',
              'config/house-audio-server.default',
              'systemd/house-audio-server.service',
              'web/house.html', 'web/house.js', 'web/house.css',
              'web/subwoofers.html', 'web/subwoofers.js', 'web/subwoofers.css',
              'pi_input/gateway.py', 'docs/CD_AUDIO_INPUT_INTEGRATION.md',
          ]
          assert 'SERVICE_VERSION = "0.14.2-cd1"' in Path('house_audio_server.py').read_text()
          assert 'data-view="inputs"' in Path('web/house.html').read_text()
          assert 'input_sources.py' in Path('install.sh').read_text()
          name = 'HouseMusic_CD_Input_Installer.zip'
          with ZipFile(name, 'w', compression=ZIP_DEFLATED, compresslevel=9) as z:
              for rel in files:
                  file = Path(rel)
                  assert file.is_file(), f'Missing installer file: {rel}'
                  item = ZipInfo('HouseMusic_CD_Input/' + rel, date_time=(2026,11,12,0,0,0))
                  item.compress_type = ZIP_DEFLATED
                  item.external_attr = ((0o100755 if rel.endswith('.sh') else 0o100644) << 16)
                  z.writestr(item, file.read_bytes())
          with ZipFile(name) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == len(files)
              assert b'CD players' in z.read('HouseMusic_CD_Input/web/house.html')
          print(f'Verified installer ZIP: {name}, {len(files)} files, bytecode and tests already passed.')
          PY
          sha256sum HouseMusic_CD_Input_Installer.zip > HouseMusic_CD_Input_Installer.sha256
          cat HouseMusic_CD_Input_Installer.sha256
      - name: Attach CD installer for direct user download
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/cd-house-playback'
        uses: actions/upload-artifact@v4
        with:
          name: HouseMusic-CD-Installer
          path: |
            HouseMusic_CD_Input_Installer.zip
            HouseMusic_CD_Input_Installer.sha256
          if-no-files-found: error
