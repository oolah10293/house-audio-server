name: Test house-audio-server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python source syntax
        run: python -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').rglob('*.py')]"
      - name: Check installer shell syntax
        run: sh -n install.sh install-cd.sh rollback-cd.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax and sorting tests
        run: |
          node --check web/house.js
          node --check web/subwoofers.js
          node tests/test_house_browse.js
