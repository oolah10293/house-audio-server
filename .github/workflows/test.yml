name: Test house-audio-server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m py_compile house_audio_server.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax and sorting tests
        run: |
          node --check web/house.js
          node --check web/subwoofers.js
          node tests/test_house_browse.js
      # Release packaging only on an explicitly requested workflow run.
      # PRs remain test-only and cannot generate an installer artifact.
      - name: Package installable House Music source
        if: github.event_name == 'workflow_dispatch'
        run: |
          git archive --format=zip --output=house-audio-server-v0.14.1.zip HEAD
          sha256sum house-audio-server-v0.14.1.zip
      - name: Upload install package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: house-audio-server-v0.14.1
          path: house-audio-server-v0.14.1.zip
          if-no-files-found: error
