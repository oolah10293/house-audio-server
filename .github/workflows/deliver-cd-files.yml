name: Authorized House Music server Pi delivery

# Packaging must be explicitly requested, never triggered by a PR update.
# The separate test.yml workflow runs ordinary PR regression checks.
on:
  workflow_dispatch:
    inputs:
      package_authorization:
        description: 'Type AUTHORIZE_SERVER_PACKAGE to allow package creation'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-package-cd-pi:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package_authorization == 'AUTHORIZE_SERVER_PACKAGE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pi integration source
        uses: actions/checkout@v4
      - name: Python syntax and installer validation
        run: |
          set -euo pipefail
          python3 -m py_compile house_audio_server.py auto_cd.py input_sources.py pi_input/gateway.py
          sh -n install.sh install-cd.sh rollback-cd.sh
      - name: Full Python regression suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
      - name: Package verified Pi source with gateway and rollback
        run: python3 tools/package_pi.py --output-dir dist
      - name: Upload Pi package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: HouseMusic_Server_v0.14.7_Pi
          path: |
            dist/HouseMusic_Server_v0.14.7_Pi.zip
            dist/HouseMusic_Server_v0.14.7_Pi.zip.sha256
          if-no-files-found: error
