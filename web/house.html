<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111419">
  <title>House Music</title>
  <link rel="stylesheet" href="/house.css">
  <script defer src="/house.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="House Music navigation">
      <a class="brand" href="/" aria-label="House Music home">
        <span class="brand-icon" aria-hidden="true">▥</span>
        <span><strong>HOUSE</strong><small>MUSIC</small></span>
      </a>
      <p class="nav-caption">YOUR MUSIC</p>
      <nav class="navigation" aria-label="Music views">
        <button type="button" data-view="browse" class="nav-button active"><span aria-hidden="true">▤</span> Library</button>
        <button type="button" data-view="radio" class="nav-button"><span aria-hidden="true">◉</span> Radio</button>
        <button type="button" data-view="inputs" class="nav-button"><span aria-hidden="true">♫</span> CD players</button>
        <button type="button" data-view="queue" class="nav-button"><span aria-hidden="true">≡</span> Queue <span class="nav-count" id="queue-count">0</span></button>
        <button type="button" data-view="speakers" class="nav-button"><span aria-hidden="true">◈</span> Speakers</button>
      </nav>
      <div class="sidebar-bottom">
        <label for="default-folder" class="setting-caption">New-session playlist</label>
        <select id="default-folder" aria-label="Default folder when a radio turns on">
          <option value="MP3s">MP3s</option>
          <option value="Rap">Rap</option>
        </select>
        <p>Used next time a passive radio starts a fresh session.</p>
        <a href="/subwoofers">Subwoofer settings <span aria-hidden="true">↗</span></a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-brand">HOUSE <span>MUSIC</span></div>
        <div class="status-strip">
          <span id="speaker-count" class="speaker-pill">◈ — speakers</span>
          <span id="connection" class="connection" role="status" aria-live="polite"><span class="status-dot"></span> Connecting</span>
        </div>
      </header>

      <section class="workarea" aria-label="Music library and controls">
        <div class="view-header">
          <div>
            <div id="view-kicker" class="eyebrow">YOUR COLLECTION</div>
            <h1 id="view-title">Library</h1>
            <div id="breadcrumbs" class="breadcrumbs" aria-label="Folder path"></div>
          </div>
          <div id="view-actions" class="view-actions"></div>
        </div>
        <div id="items" class="items" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <section class="player" aria-label="Now playing">
    <div class="track-block">
      <div class="record" aria-hidden="true"><span>♫</span></div>
      <div class="track-meta">
        <span id="source-label" class="source-label">HOUSE AUDIO</span>
        <strong id="track-title">Nothing playing</strong>
        <span id="track-subtitle">Choose a folder or a radio station</span>
      </div>
    </div>
    <div class="transport-block">
      <div class="transport-controls">
        <button id="shuffle" type="button" class="transport small" title="Shuffle" aria-label="Toggle shuffle">⇄</button>
        <button id="previous" type="button" class="transport" title="Previous song" aria-label="Previous song">|◀</button>
        <button id="play-pause" type="button" class="transport play" title="Play or pause" aria-label="Play">▶</button>
        <button id="next" type="button" class="transport" title="Next song" aria-label="Next song">▶|</button>
        <button id="repeat" type="button" class="transport small" title="Repeat all" aria-label="Toggle repeat">↻</button>
        <button id="stop" type="button" class="transport small" title="Stop" aria-label="Stop">■</button>
      </div>
      <div class="progress-row">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Song position" disabled>
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-end">
      <button id="resume" type="button" class="resume-button" hidden>↩ Resume playlist</button>
      <span id="playback-state" class="playback-state">STOPPED</span>
    </div>
  </section>
  <div id="notice" class="notice" role="alert" hidden></div>
</body>
</html>
